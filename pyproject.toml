[build-system]
requires = ["scikit-build-core>=0.10", "torch"]
build-backend = "scikit_build_core.build"

[project]
name = "shardstream"
version = "0.1.0"
description = "CUDA communication for sharded model weight streams"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["torch"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.scikit-build]
wheel.packages = ["python/shardstream"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
SHARDSTREAM_BUILD_PYTHON = "ON"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
